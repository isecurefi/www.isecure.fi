<svg width="800" height="533" viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="533" fill="#f8f9fa"/>
  
  <!-- API Gateway -->
  <g transform="translate(400,266.5)">
    <!-- Central Hub -->
    <circle cx="0" cy="0" r="120" fill="#0d6efd" opacity="0.1" stroke="#0d6efd" stroke-width="3"/>
    <circle cx="0" cy="0" r="90" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
    
    <!-- API Text -->
    <text x="0" y="10" font-family="Arial" font-size="36" fill="#0d6efd" text-anchor="middle" font-weight="bold">API</text>
    
    <!-- Connecting Nodes -->
    <g id="node" transform="translate(-160,-160)">
      <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
      <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="#0d6efd" stroke-width="2"/>
    </g>
    
    <!-- Duplicate nodes at different positions -->
    <use href="#node" transform="translate(160,-160)"/>
    <use href="#node" transform="translate(160,160)"/>
    <use href="#node" transform="translate(-160,160)"/>
    
    <!-- Connection lines -->
    <g stroke="#0d6efd" stroke-width="2" opacity="0.7">
      <line x1="-120" y1="-120" x2="-30" y2="-30"/>
      <line x1="120" y1="-120" x2="30" y2="-30"/>
      <line x1="120" y1="120" x2="30" y2="30"/>
      <line x1="-120" y1="120" x2="-30" y2="30"/>
    </g>
    
    <!-- Data flow indicators -->
    <g fill="#0d6efd" opacity="0.7">
      <circle cx="-75" cy="-75" r="5">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="75" cy="-75" r="5">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle cx="75" cy="75" r="5">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="-75" cy="75" r="5">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
    </g>
  </g>
</svg>
